[build-system]
requires = ["setuptools>=78", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "Groovier"
description = "Discord Music Bot"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "discord.py==2.3.2",
    "yt-dlp==2023.12.30",
    "PyNaCl==1.5.0",
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "aiohttp==3.9.1",
    "python-dotenv==1.2.1"
]

[tool.setuptools.dynamic.version]
attr = "groovier.version.__version__"

[project.scripts]
local = "groovier.scripts.discord_music_bot:main"
web   = "groovier.scripts.web_app:main"

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
preview = true
extend-safe-fixes = ["EM101", "TC"]
ignore = [
    "COM",     # Black controls formatting
    "CPY",     # License files are typically used in place of per-file copyright notices
    "D",       # Breaks too much existing code. TODO: Enable subset, needs testing
    "DOC201",  # TODO: work towards enabling
    "DOC202",  # Conflicts with inheritable docstrings in ABCs. Enable if this gets resolved
    "DOC402",  # TODO: work towards enabling
    "DOC501",  # TODO: work towards enabling
    "E2",      # black handles formatting
    "E3",      # black handles formatting
    "E501",    # black handles line length
    "ERA",     # Eradicate has mixed results detecting commented out code
    "FIX",     # Not necessary
    "G",       # Breaks existing loggers
    "ISC001",  # handled by ruff format
    "PLR0911", # using C901 for code complexity
    "PLR0912", # using C901 for code complexity
    "PLR0915", # using C901 for code complexity
    "PTH123",  # disagree
    "RUF012",  # not compatible with pydantic classes
    "TD",      # Need to establish agreed upon TODO spec
    "TID252",  # we use explicit relative imports (which PEP8 says is acceptable)
]
