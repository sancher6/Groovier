[build-system]
requires = ["setuptools>=64", "wheel>=0.41"]
build-backend = "setuptools.build_meta" 

[project]
name = "Groovier"
description = "Discord Music Bot" 
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.3.2",
    "yt-dlp==2023.12.30",
    "PyNaCl==1.5.0",
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "aiohttp==3.9.1"
]
scripts = { web_scraper = "gaby_lookup_table.scripts.web_scraper:main" }

dynamic=["version"]

[tool.coverage.run]
source=["src"]

[tool.coverage.report]
show_missing=true

[tool.setuptools.dynamic.version]
attr="groovier.version.__version__"

