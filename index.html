<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Music Bot - Live Queue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Archivo:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffff00;
            --dark-bg: #0a0a0f;
            --dark-surface: #151520;
            --dark-elevated: #1f1f2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --vinyl-gradient: linear-gradient(135deg, #2d1b3d 0%, #1a1a2e 50%, #0f0f1e 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Archivo', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background with floating gradients */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 0, 0.05) 0%, transparent 50%);
            animation: floatGradient 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatGradient {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-5%, 5%) rotate(120deg); }
            66% { transform: translate(5%, -5%) rotate(240deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header with glowing neon effect */
        header {
            text-align: center;
            padding: 3rem 0;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            animation: glow 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            position: relative;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 20px rgba(0, 255, 255, 0.7)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 40px rgba(255, 0, 255, 0.7)); }
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.3rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            text-transform: uppercase;
        }

        /* Status indicator */
        .status-bar {
            background: var(--dark-surface);
            border: 2px solid var(--dark-elevated);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            margin: 2rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .pulse-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan);
            animation: pulse 2s ease-in-out infinite;
        }

        .pulse-dot.paused {
            background: var(--neon-yellow);
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .pulse-dot.stopped {
            background: #666;
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
        }

        /* Main grid layout */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card styling with vinyl record aesthetic */
        .card {
            background: var(--vinyl-gradient);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 12px 48px rgba(0, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .card-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            position: relative;
            z-index: 1;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Now Playing section with vinyl record visual */
        .now-playing {
            display: flex;
            gap: 2rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .vinyl-container {
            width: 180px;
            height: 180px;
            flex-shrink: 0;
            position: relative;
        }

        .vinyl-record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at center, #1a1a1a 0%, #1a1a1a 20%, #0a0a0a 20%, #0a0a0a 25%, #1a1a1a 25%, #1a1a1a 100%);
            position: relative;
            box-shadow: 
                0 0 0 3px rgba(255, 255, 255, 0.1),
                0 8px 32px rgba(0, 0, 0, 0.8);
        }

        .vinyl-record.spinning {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40%;
            height: 40%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--neon-cyan), var(--neon-magenta));
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .vinyl-grooves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image: repeating-radial-gradient(
                circle at center,
                transparent 0px,
                transparent 2px,
                rgba(255, 255, 255, 0.05) 2px,
                rgba(255, 255, 255, 0.05) 4px
            );
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .song-requester {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .song-requester::before {
            content: '▶ ';
            color: var(--neon-cyan);
        }

        /* Queue items */
        .queue-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .queue-list::-webkit-scrollbar {
            width: 8px;
        }

        .queue-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .queue-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-magenta));
            border-radius: 10px;
        }

        .queue-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease backwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .queue-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--neon-cyan);
            transform: translateX(5px);
        }

        .queue-number {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--neon-cyan);
            min-width: 40px;
            text-align: center;
        }

        .queue-song-info {
            flex: 1;
        }

        .queue-song-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .queue-song-requester {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Playlist cards */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            position: relative;
            z-index: 1;
        }

        .playlist-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .playlist-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .playlist-card:hover {
            border-color: var(--neon-cyan);
            transform: scale(1.05);
        }

        .playlist-card:hover::after {
            opacity: 0.1;
        }

        .playlist-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .playlist-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }

        .playlist-count::before {
            content: '♪ ';
            color: var(--neon-magenta);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Refresh button */
        .refresh-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .refresh-btn:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 6px 30px rgba(255, 0, 255, 0.7);
        }

        .refresh-btn:active {
            transform: scale(0.95) rotate(180deg);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--neon-cyan);
            animation: spin 1s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: 0.3rem;
            }

            .now-playing {
                flex-direction: column;
                text-align: center;
            }

            .status-bar {
                flex-direction: column;
                gap: 1rem;
            }

            .playlist-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SoundWave</h1>
            <div class="subtitle">Discord Music Bot</div>
        </header>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="pulse-dot" id="statusDot"></div>
                <div class="status-text" id="statusText">Loading...</div>
            </div>
            <div id="lastUpdate" style="color: var(--text-secondary); font-size: 0.9rem;"></div>
        </div>

        <div class="grid">
            <!-- Now Playing -->
            <div class="card">
                <h2 class="card-header">Now Playing</h2>
                <div id="nowPlaying">
                    <div class="empty-state">
                        <div class="empty-icon">🎵</div>
                        <p>No song currently playing</p>
                    </div>
                </div>
            </div>

            <!-- Queue -->
            <div class="card">
                <h2 class="card-header">Up Next</h2>
                <div id="queueContainer">
                    <div class="empty-state">
                        <div class="empty-icon">📜</div>
                        <p>Queue is empty</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Playlists -->
        <div class="card" style="margin-top: 2rem;">
            <h2 class="card-header">Saved Playlists</h2>
            <div id="playlistsContainer">
                <div class="empty-state">
                    <div class="empty-icon">💿</div>
                    <p>No playlists saved yet</p>
                </div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadData()" title="Refresh">⟳</button>

    <script>
        async function loadData() {
            try {
                // Load queue
                const queueResponse = await fetch('/api/queue');
                const queueData = await queueResponse.json();
                updateQueue(queueData);

                // Load playlists
                const playlistsResponse = await fetch('/api/playlists');
                const playlistsData = await playlistsResponse.json();
                updatePlaylists(playlistsData);

                // Update last update time
                const now = new Date();
                document.getElementById('lastUpdate').textContent = 
                    `Last updated: ${now.toLocaleTimeString()}`;
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function updateQueue(data) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            // Update status
            if (data.is_playing) {
                if (data.is_paused) {
                    statusDot.className = 'pulse-dot paused';
                    statusText.textContent = 'Paused';
                } else {
                    statusDot.className = 'pulse-dot';
                    statusText.textContent = 'Playing';
                }
            } else {
                statusDot.className = 'pulse-dot stopped';
                statusText.textContent = 'Stopped';
            }

            // Update now playing
            const nowPlayingDiv = document.getElementById('nowPlaying');
            if (data.current_song) {
                const isSpinning = data.is_playing && !data.is_paused;
                nowPlayingDiv.innerHTML = `
                    <div class="now-playing">
                        <div class="vinyl-container">
                            <div class="vinyl-record ${isSpinning ? 'spinning' : ''}">
                                <div class="vinyl-grooves"></div>
                                <div class="vinyl-center"></div>
                            </div>
                        </div>
                        <div class="song-info">
                            <div class="song-title">${escapeHtml(data.current_song.title)}</div>
                            <div class="song-requester">Requested by ${escapeHtml(data.current_song.requester)}</div>
                        </div>
                    </div>
                `;
            } else {
                nowPlayingDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🎵</div>
                        <p>No song currently playing</p>
                    </div>
                `;
            }

            // Update queue
            const queueContainer = document.getElementById('queueContainer');
            if (data.queue && data.queue.length > 0) {
                const queueHtml = data.queue.map((song, index) => `
                    <li class="queue-item" style="animation-delay: ${index * 0.05}s">
                        <div class="queue-number">${index + 1}</div>
                        <div class="queue-song-info">
                            <div class="queue-song-title">${escapeHtml(song.title)}</div>
                            <div class="queue-song-requester">${escapeHtml(song.requester)}</div>
                        </div>
                    </li>
                `).join('');
                
                queueContainer.innerHTML = `<ul class="queue-list">${queueHtml}</ul>`;
            } else {
                queueContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📜</div>
                        <p>Queue is empty</p>
                    </div>
                `;
            }
        }

        function updatePlaylists(playlists) {
            const playlistsContainer = document.getElementById('playlistsContainer');
            
            if (playlists && playlists.length > 0) {
                const playlistsHtml = playlists.map(playlist => `
                    <div class="playlist-card" onclick="showPlaylist('${escapeHtml(playlist.name)}')">
                        <div class="playlist-name">${escapeHtml(playlist.name)}</div>
                        <div class="playlist-count">${playlist.count} songs</div>
                    </div>
                `).join('');
                
                playlistsContainer.innerHTML = `<div class="playlist-grid">${playlistsHtml}</div>`;
            } else {
                playlistsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💿</div>
                        <p>No playlists saved yet</p>
                    </div>
                `;
            }
        }

        function showPlaylist(name) {
            alert(`Playlist: ${name}\n\nUse Discord commands to load this playlist!`);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 5 seconds
        setInterval(loadData, 5000);
    </script>
</body>
</html>
